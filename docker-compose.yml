version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: scanner_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - scanner_net

  redis:
    image: redis:7-alpine
    container_name: scanner_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - scanner_net

  ml-service:
    build:
      context: ./ml-service
    container_name: scanner_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - scanner_net

  node-service:
    build:
      context: ./node-service
    container_name: scanner_node
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/scanner
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ML_SERVICE_URL=http://ml-service:8000
      - PORT=4000
    depends_on:
      - mongo
      - redis
      - ml-service
    networks:
      - scanner_net

  frontend:
    build:
      context: ./frontend
    container_name: scanner_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - node-service
    networks:
      - scanner_net

networks:
  scanner_net:
    driver: bridge

volumes:
  mongo_data:
